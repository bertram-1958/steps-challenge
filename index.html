<style>
    :root {
      --green: #000000;
      --green-dark: #000000;
      --cream: #ffffff;
      --yellow: #ffd85c;
      --text: #111111;
      --muted: #777777;
      --danger: #c63838;
      --shadow: 0 12px 30px rgba(0, 0, 0, .22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000000;
    }

    body {
      position: relative;
      min-height: 100vh;
      font-family: "Prompt", sans-serif;
      color: var(--text);
      background: transparent;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100svh;
      background-image: url("images/background.png");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% auto;
      background-color: #000000;
      z-index: -1;
      pointer-events: none;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .app {
      width:min(calc(100% - 24px),560px);
      margin: 0 auto;
      padding:6px 0 40px;
    }

    .hero {
      text-align: center;
      padding: 22px 16px 18px;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 14px;
      border: 2px solid var(--green-dark);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      font-size: 13px;
      font-weight: 700;
    }

    .hero h1 {
      margin: 12px 0 6px;
      font-size: clamp(31px, 8vw, 48px);
      line-height: 1;
      font-weight: 800;
    }

    .hero p {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .card,
    .stat-card {
      background: rgba(255, 255, 255, .94);
      border: 3px solid var(--green-dark);
      border-radius: 26px;
      box-shadow: 0 7px 0 var(--green-dark), var(--shadow);
    }

    .card {
      margin-bottom: 18px;
      padding: 18px;
    }

    .card h2,
    .stat-card h3 {
      margin: 0 0 14px;
    }

    .field {
      margin-bottom: 13px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    button {
      font-family: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d9e4d8;
      border-radius: 16px;
      background: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(0, 0, 0, .12);
    }

    input[type="file"] {
      padding: 10px;
      background: var(--cream);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .submit-btn,
    .refresh-btn {
      width: 100%;
      cursor: pointer;
      font-weight: 800;
    }

    .submit-btn {
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: var(--yellow);
      color: #102e18;
      font-size: 18px;
      box-shadow: 0 6px 0 #bb8f10;
    }

    .submit-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .refresh-btn {
      padding: 10px;
      border: 2px solid var(--green-dark);
      border-radius: 16px;
      background: #fff;
      color: var(--green-dark);
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #f2f2f2;
      color: #111111;
    }

    .message.error {
      background: #ffe6e6;
      color: var(--danger);
    }

    .preview-wrap {
      display: none;
      margin-top: 10px;
      text-align: center;
    }

    .preview-wrap.show {
      display: block;
    }

    #imagePreview {
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      border: 2px solid #d9e4d8;
      border-radius: 16px;
      background: #f7f7f7;
    }

    .file-info {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .dashboard {
      display: grid;
      gap: 16px;
    }

    .stat-card {
      padding: 17px;
    }

    .big-number {
      color: #000000;
      font-size: 42px;
      line-height: 1;
      font-weight: 800;
    }

    .subtext {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .leaderboard-row,
    .team-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #eadfbd;
      border-radius: 14px;
      background: var(--cream);
    }

    .rank {
      text-align: center;
      font-weight: 800;
    }

    .name {
      font-size: 14px;
      font-weight: 700;
    }

    .dept {
      color: var(--muted);
      font-size: 11px;
    }

    .steps {
      color: #000000;
      font-weight: 800;
      white-space: nowrap;
    }

    .loading {
      padding: 15px 0;
      color: var(--muted);
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .leaderboard-row,
      .team-row {
        grid-template-columns: 34px 1fr auto;

        max-width: 100% !important;

        min-width: 0 !important;
        max-width: 100% !important;

        padding-right: 12px !important;

    const employeeSuggestions = document.getElementById("employeeSuggestions");

    let compressedImageBlob = null;

    function initOptions() {
      EMPLOYEES.sort((a, b) => a.localeCompare(b, "en", { sensitivity: "base" }));

      department.innerHTML =
        `<option value="">เลือกแผนก</option>` +
        DEPARTMENTS
          .map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`)
          .join("");

      team.innerHTML =
        `<option value="">เลือกทีม</option>` +
        TEAMS
          .map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`)
          .join("");

      stepDate.value = new Date().toISOString().slice(0, 10);
    }

    evidence.addEventListener("change", handleImageSelection);
    employeeName.addEventListener("input", handleEmployeeSearch);
    employeeName.addEventListener("keydown", handleEmployeeKeydown);
    employeeName.addEventListener("blur", () => {
      setTimeout(() => closeEmployeeSuggestions(), 150);
    });
    document.addEventListener("click", event => {
      if (!event.target.closest(".employee-autocomplete")) {
        closeEmployeeSuggestions();
      }
    });
    document.getElementById("refreshBtn").addEventListener("click", loadDashboard);
    submitBtn.addEventListener("click", submitSteps);

    let activeSuggestionIndex = -1;
    let visibleEmployeeMatches = [];

    function handleEmployeeSearch() {
      const query = employeeName.value.trim().toLowerCase();
      activeSuggestionIndex = -1;

      if (!query) {
        closeEmployeeSuggestions();
        return;
      }

      visibleEmployeeMatches = EMPLOYEES
        .filter(name => name.toLowerCase().includes(query))
        .slice(0, 5);

      renderEmployeeSuggestions();
    }

    function renderEmployeeSuggestions() {
      if (!visibleEmployeeMatches.length) {
        employeeSuggestions.innerHTML =
          `<div class="autocomplete-empty">ไม่พบรายชื่อพนักงาน</div>`;
        employeeSuggestions.classList.add("show");
        return;
      }

      employeeSuggestions.innerHTML = visibleEmployeeMatches
        .map((name, index) => `
          <div class="autocomplete-item"
               data-index="${index}"
               role="option"
               tabindex="-1">${escapeHtml(name)}</div>
        `)
        .join("");

      employeeSuggestions.classList.add("show");

      employeeSuggestions.querySelectorAll(".autocomplete-item").forEach(item => {
        item.addEventListener("mousedown", event => {
          event.preventDefault();
          selectEmployee(Number(item.dataset.index));
        });
      });
    }

    function handleEmployeeKeydown(event) {
      if (!employeeSuggestions.classList.contains("show")) {
        return;
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();
        activeSuggestionIndex =
          Math.min(activeSuggestionIndex + 1, visibleEmployeeMatches.length - 1);
        updateActiveSuggestion();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
        updateActiveSuggestion();
      } else if (event.key === "Enter" && activeSuggestionIndex >= 0) {
        event.preventDefault();
        selectEmployee(activeSuggestionIndex);
      } else if (event.key === "Escape") {
        closeEmployeeSuggestions();
      }
    }

    function updateActiveSuggestion() {
      employeeSuggestions.querySelectorAll(".autocomplete-item").forEach((item, index) => {
        item.classList.toggle("active", index === activeSuggestionIndex);
      });
    }

    function selectEmployee(index) {
      const selectedName = visibleEmployeeMatches[index];
      if (!selectedName) return;

      employeeName.value = selectedName;
      closeEmployeeSuggestions();
      loadDashboard();
    }

    function closeEmployeeSuggestions() {
      employeeSuggestions.classList.remove("show");
      employeeSuggestions.innerHTML = "";
      activeSuggestionIndex = -1;
      visibleEmployeeMatches = [];
    }

    async function handleImageSelection() {
      clearMessage();

      const file = evidence.files[0];
      const wrap = document.getElementById("previewWrap");
      const preview = document.getElementById("imagePreview");
      const fileInfo = document.getElementById("fileInfo");

      compressedImageBlob = null;

      if (!file) {
        wrap.classList.remove("show");
        preview.src = "";
        fileInfo.textContent = "";
        return;
      }

      if (!file.type.startsWith("image/")) {
        evidence.value = "";
        return showMessage("กรุณาเลือกไฟล์รูปภาพเท่านั้น", "error");
      }

      if (file.size > MAX_ORIGINAL_FILE_SIZE) {
        evidence.value = "";
        return showMessage("ไฟล์ต้นฉบับต้องมีขนาดไม่เกิน 10 MB", "error");
      }

      try {
        compressedImageBlob = await compressImage(
          file,
          IMAGE_MAX_WIDTH,
          IMAGE_QUALITY
        );

        preview.src = URL.createObjectURL(compressedImageBlob);
        wrap.classList.add("show");

        fileInfo.textContent =
          `ไฟล์เดิม ${formatFileSize(file.size)} → หลังบีบ ${formatFileSize(compressedImageBlob.size)}`;
      } catch (error) {
        console.error(error);
        evidence.value = "";
        compressedImageBlob = null;
        showMessage("ไม่สามารถประมวลผลรูปภาพนี้ได้ กรุณาเลือกรูปอื่น", "error");
      }
    }

    async function submitSteps() {
      clearMessage();

      const name = employeeName.value.trim();
      const dept = department.value;
      const teamName = team.value;
      const date = stepDate.value;
      const stepCount = Number(steps.value);
      const originalFile = evidence.files[0];

      if (!EMPLOYEES.includes(name)) {
        return showMessage("กรุณาเลือกชื่อจากรายการพนักงาน", "error");
      }

      if (!dept || !teamName || !date || !stepCount || stepCount <= 0) {
        return showMessage("กรุณากรอกข้อมูลให้ครบทุกช่อง", "error");
      }

      if (!originalFile || !compressedImageBlob) {
        return showMessage("กรุณาแนบภาพหลักฐาน", "error");
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังส่ง...";

      try {
        const imageBase64 = await blobToBase64(compressedImageBlob);

        const payload = {
          action: "submit",
          name,
          department: dept,
          team: teamName,
          date,
          steps: stepCount,
          fileName: createCompressedFileName(originalFile.name),
          mimeType: "image/jpeg",
          imageBase64
        };

        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(payload)
        });

        showMessage("บันทึกจำนวนก้าวเรียบร้อยแล้ว 👣", "success");

        steps.value = "";
        evidence.value = "";
        compressedImageBlob = null;

        document.getElementById("previewWrap").classList.remove("show");
        document.getElementById("imagePreview").src = "";
        document.getElementById("fileInfo").textContent = "";

        setTimeout(loadDashboard, 1800);
      } catch (error) {
        console.error(error);
        showMessage("ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT";
      }
    }

    async function loadDashboard() {
      const name = employeeName.value.trim();
      const params = new URLSearchParams({
        action: "dashboard",
        name,
        t: Date.now().toString()
      });

      try {
        const response = await fetch(`${API_URL}?${params.toString()}`);
        const data = await response.json();

        renderMySteps(data.mySteps || 0, name);
        renderLeaderboard(data.top10 || []);
        renderTeams(data.teams || []);
      } catch (error) {
        console.error(error);
        document.getElementById("leaderboardList").innerHTML = "โหลดข้อมูลไม่สำเร็จ";
        document.getElementById("teamList").innerHTML = "โหลดข้อมูลไม่สำเร็จ";
      }
    }

    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = () => {
          URL.revokeObjectURL(objectUrl);

          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");

          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));

          const ctx = canvas.getContext("2d");

          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(
            blob => {
              if (!blob) {
                reject(new Error("Image compression failed"));
                return;
              }

              resolve(blob);
            },
            "image/jpeg",
            quality
          );
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Cannot read image"));
        };

        img.src = objectUrl;
      });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          resolve(String(reader.result).split(",")[1]);
        };

        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function createCompressedFileName(originalName) {
      const baseName = originalName.replace(/\.[^/.]+$/, "");
      return `${baseName}-compressed.jpg`;
    }

    function renderMySteps(value, name) {
      document.getElementById("mySteps").textContent =
        Number(value).toLocaleString();

      document.getElementById("myStepsLabel").textContent =
        name
          ? `ยอดสะสมของ ${name}`
          : "กรอกชื่อเพื่อดูยอดสะสมของคุณ";
    }

    function renderLeaderboard(items) {
      const el = document.getElementById("leaderboardList");

      if (!items.length) {
        el.innerHTML = `<div class="loading">ยังไม่มีข้อมูล</div>`;
        return;
      }

      el.innerHTML = items.map((item, index) => `
        <div class="leaderboard-row">
          <div class="rank">${medal(index)}</div>
          <div>
            <div class="name">${escapeHtml(item.name)}</div>
            <div class="dept">${escapeHtml(item.department || "")}</div>
          </div>
          <div class="steps">${Number(item.steps).toLocaleString()}</div>
        </div>
      `).join("");
    }

    function renderTeams(items) {
      const el = document.getElementById("teamList");

      if (!items.length) {
        el.innerHTML = `<div class="loading">ยังไม่มีข้อมูล</div>`;
        return;
      }

      el.innerHTML = items.map((item, index) => `
        <div class="team-row">
          <div class="rank">${index + 1}</div>
          <div class="name">${escapeHtml(item.team)}</div>
          <div class="steps">${Number(item.steps).toLocaleString()}</div>
        </div>
      `).join("");
    }

    function medal(index) {
      return ["🥇", "🥈", "🥉"][index] || (index + 1);
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) {
        return `${bytes} B`;
      }

      if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(0)} KB`;
      }

      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = `message show ${type}`;
    }

    function clearMessage() {
      formMessage.textContent = "";
      formMessage.className = "message";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    initOptions();
    loadDashboard();
  </script>
</body>
</html>
