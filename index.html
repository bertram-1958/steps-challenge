<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Office Step Challenge</title>
<meta content="#6bcf63" name="theme-color"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --green: #68d05f;
      --green-dark: #174d2a;
      --cream: #fffaf0;
      --yellow: #ffd85c;
      --text: #173c25;
      --muted: #6f7f73;
      --danger: #c63838;
      --shadow: 0 12px 30px rgba(20, 70, 40, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Prompt", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 255, 255, .9), transparent 30%),
        linear-gradient(180deg, #b9edff 0%, #eaffdd 42%, #79d653 100%);
    }

    .app {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .hero {
      text-align: center;
      padding: 22px 16px 18px;
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 14px;
      border: 2px solid var(--green-dark);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      font-size: 13px;
      font-weight: 700;
    }

    .hero h1 {
      margin: 12px 0 6px;
      font-size: clamp(31px, 8vw, 48px);
      line-height: 1;
      font-weight: 800;
    }

    .hero p {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .card,
    .stat-card {
      background: rgba(255, 255, 255, .94);
      border: 3px solid var(--green-dark);
      border-radius: 26px;
      box-shadow: 0 7px 0 var(--green-dark), var(--shadow);
    }

    .card {
      margin-bottom: 18px;
      padding: 18px;
    }

    .card h2,
    .stat-card h3 {
      margin: 0 0 14px;
    }

    .field {
      margin-bottom: 13px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    button {
      font-family: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d9e4d8;
      border-radius: 16px;
      background: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(104, 208, 95, .17);
    }

    input[type="file"] {
      padding: 10px;
      background: var(--cream);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .submit-btn,
    .refresh-btn {
      width: 100%;
      cursor: pointer;
      font-weight: 800;
    }

    .submit-btn {
      padding: 14px;
      border: 0;
      border-radius: 18px;
      background: var(--yellow);
      color: #102e18;
      font-size: 18px;
      box-shadow: 0 6px 0 #bb8f10;
    }

    .submit-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .refresh-btn {
      padding: 10px;
      border: 2px solid var(--green-dark);
      border-radius: 16px;
      background: #fff;
      color: var(--green-dark);
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e6f8e2;
      color: #145b27;
    }

    .message.error {
      background: #ffe6e6;
      color: var(--danger);
    }

    .preview-wrap {
      display: none;
      margin-top: 10px;
      text-align: center;
    }

    .preview-wrap.show {
      display: block;
    }

    #imagePreview {
      max-width: 100%;
      max-height: 260px;
      object-fit: contain;
      border: 2px solid #d9e4d8;
      border-radius: 16px;
      background: #f7f7f7;
    }

    .file-info {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .dashboard {
      display: grid;
      gap: 16px;
    }

    .stat-card {
      padding: 17px;
    }

    .big-number {
      color: #146b2f;
      font-size: 42px;
      line-height: 1;
      font-weight: 800;
    }

    .subtext {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .leaderboard-row,
    .team-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #eadfbd;
      border-radius: 14px;
      background: var(--cream);
    }

    .rank {
      text-align: center;
      font-weight: 800;
    }

    .name {
      font-size: 14px;
      font-weight: 700;
    }

    .dept {
      color: var(--muted);
      font-size: 11px;
    }

    .steps {
      color: #12632b;
      font-weight: 800;
      white-space: nowrap;
    }

    .loading {
      padding: 15px 0;
      color: var(--muted);
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .leaderboard-row,
      .team-row {
        grid-template-columns: 34px 1fr auto;
      }
    }
  
:root{--brand-red:#c80000;}
body{background:linear-gradient(180deg,#c80000,#a80000)!important;}
.hero-badge,.hero h1,.hero p{display:none!important;}
.hero{padding:8px 0 10px}
.hero img{max-width:430px;width:100%;display:block;margin:auto}
@media(max-width:420px){.grid-2{grid-template-columns:1fr 1fr!important;}#stepDate,#steps{font-size:14px;padding:12px 10px;min-width:0;}}
</style>
</head>
<body>
<main class="app">
<header class="hero"><img src="logo(1).png"/></header>
<section class="card">
<h2>ส่งจำนวนก้าววันนี้</h2>
<div class="field">
<label for="employeeName">ชื่อพนักงาน</label>
<input autocomplete="off" id="employeeName" list="employeeList" placeholder="ค้นหาชื่อพนักงาน..."/>
<datalist id="employeeList"></datalist>
</div>
<div class="grid-2">
<div class="field">
<label for="department">แผนก</label>
<select id="department">
<option value="">เลือกแผนก</option>
</select>
</div>
<div class="field">
<label for="team">ทีม</label>
<select id="team">
<option value="">เลือกทีม</option>
</select>
</div>
</div>
<div class="grid-2">
<div class="field">
<label for="stepDate">วันที่</label>
<input id="stepDate" readonly="readonly" type="text"/>
</div>
<div class="field">
<label for="steps">จำนวนก้าว</label>
<input id="steps" inputmode="numeric" max="100000" min="1" placeholder="เช่น 12500" type="number"/>
</div>
</div>
<div class="field">
<label for="evidence">แนบภาพหลักฐาน</label>
<input accept="image/*" id="evidence" type="file"/>
<div class="preview-wrap" id="previewWrap">
<img alt="ตัวอย่างภาพหลักฐาน" id="imagePreview"/>
<div class="file-info" id="fileInfo"></div>
</div>
</div>
<button class="submit-btn" id="submitBtn" type="button">SUBMIT</button>
<div class="message" id="formMessage"></div>
</section>
<section class="dashboard">
<div class="stat-card">
<h3>👣 จำนวนก้าวของฉัน</h3>
<div class="big-number" id="mySteps">0</div>
<div class="subtext" id="myStepsLabel">กรอกชื่อเพื่อดูยอดสะสมของคุณ</div>
</div>
<div class="stat-card">
<h3>🏆 Top 10</h3>
<div class="loading" id="leaderboardList">กำลังโหลดข้อมูล...</div>
</div>
<div class="stat-card">
<h3>👥 จำนวนก้าวรวมของทุกทีม</h3>
<div class="loading" id="teamList">กำลังโหลดข้อมูล...</div>
</div>
<button class="refresh-btn" id="refreshBtn">รีเฟรช Dashboard</button>
</section>
</main>
<script>
    // ใส่ URL Web App จาก Google Apps Script ตรงนี้
    const API_URL = "https://script.google.com/macros/s/AKfycbxQWXph_Oa0LT3UtVOU-zfX_H8fcp-RSJvt4R08mCvkzpQb43IlVeDRI11s7A9c6Rth/exec";

    // ปรับค่าบีบอัดรูปตรงนี้
    const IMAGE_MAX_WIDTH = 720;
    const IMAGE_QUALITY = 0.50;
    const MAX_ORIGINAL_FILE_SIZE = 10 * 1024 * 1024;

    // ใส่รายชื่อพนักงานทั้งหมดตรงนี้
    const EMPLOYEES = [
      "Sunisa Pachvijit",
      "Pratarn Thongtaweechaiyakaij",
      "Chatsuda Khamkhun"
    ];

    const DEPARTMENTS = [
      "Accounting & Finance",
      "Corporate Communication",
      "Domestic Sales",
      "E-Commerce",
      "Executive",
      "Human Resource & Administration",
      "Information Technology",
      "Internal Audit",
      "International Business Development",
      "International Marketing",
      "Marketing",
      "Procurement",
      "Product Development",
      "Regulatory Affairs",
      "Research & Development",
      "Supply Chain"
    ];

    // แก้ชื่อทีมตรงนี้
    const TEAMS = [
      "Team Green",
      "Team Blue",
      "Team Yellow",
      "Team Red"
    ];

    const employeeName = document.getElementById("employeeName");
    const department = document.getElementById("department");
    const team = document.getElementById("team");
    const stepDate = document.getElementById("stepDate");
    const steps = document.getElementById("steps");
    const evidence = document.getElementById("evidence");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");

    let compressedImageBlob = null;

    function initOptions() {
      const employeeList = document.getElementById("employeeList");

      employeeList.innerHTML = EMPLOYEES
        .map(name => `<option value="${escapeHtml(name)}"></option>`)
        .join("");

      department.innerHTML =
        `<option value="">เลือกแผนก</option>` +
        DEPARTMENTS
          .map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`)
          .join("");

      team.innerHTML =
        `<option value="">เลือกทีม</option>` +
        TEAMS
          .map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`)
          .join("");

      const d=new Date();
const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
stepDate.value=`${d.getDate()} ${m[d.getMonth()]} BE ${d.getFullYear()+543}`;
    }

    evidence.addEventListener("change", handleImageSelection);
    employeeName.addEventListener("change", loadDashboard);
    document.getElementById("refreshBtn").addEventListener("click", loadDashboard);
    submitBtn.addEventListener("click", submitSteps);

    async function handleImageSelection() {
      clearMessage();

      const file = evidence.files[0];
      const wrap = document.getElementById("previewWrap");
      const preview = document.getElementById("imagePreview");
      const fileInfo = document.getElementById("fileInfo");

      compressedImageBlob = null;

      if (!file) {
        wrap.classList.remove("show");
        preview.src = "";
        fileInfo.textContent = "";
        return;
      }

      if (!file.type.startsWith("image/")) {
        evidence.value = "";
        return showMessage("กรุณาเลือกไฟล์รูปภาพเท่านั้น", "error");
      }

      if (file.size > MAX_ORIGINAL_FILE_SIZE) {
        evidence.value = "";
        return showMessage("ไฟล์ต้นฉบับต้องมีขนาดไม่เกิน 10 MB", "error");
      }

      try {
        compressedImageBlob = await compressImage(
          file,
          IMAGE_MAX_WIDTH,
          IMAGE_QUALITY
        );

        preview.src = URL.createObjectURL(compressedImageBlob);
        wrap.classList.add("show");

        fileInfo.textContent =
          `ไฟล์เดิม ${formatFileSize(file.size)} → หลังบีบ ${formatFileSize(compressedImageBlob.size)}`;
      } catch (error) {
        console.error(error);
        evidence.value = "";
        compressedImageBlob = null;
        showMessage("ไม่สามารถประมวลผลรูปภาพนี้ได้ กรุณาเลือกรูปอื่น", "error");
      }
    }

    async function submitSteps() {
      clearMessage();

      const name = employeeName.value.trim();
      const dept = department.value;
      const teamName = team.value;
      const date = new Date().toISOString().slice(0,10);
      const stepCount = Number(steps.value);
      const originalFile = evidence.files[0];

      if (!EMPLOYEES.includes(name)) {
        return showMessage("กรุณาเลือกชื่อจากรายการพนักงาน", "error");
      }

      if (!dept || !teamName || !date || !stepCount || stepCount <= 0) {
        return showMessage("กรุณากรอกข้อมูลให้ครบทุกช่อง", "error");
      }

      if (!originalFile || !compressedImageBlob) {
        return showMessage("กรุณาแนบภาพหลักฐาน", "error");
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังส่ง...";

      try {
        const imageBase64 = await blobToBase64(compressedImageBlob);

        const payload = {
          action: "submit",
          name,
          department: dept,
          team: teamName,
          date,
          steps: stepCount,
          fileName: createCompressedFileName(originalFile.name),
          mimeType: "image/jpeg",
          imageBase64
        };

        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(payload)
        });

        showMessage("บันทึกจำนวนก้าวเรียบร้อยแล้ว 👣", "success");

        steps.value = "";
        evidence.value = "";
        compressedImageBlob = null;

        document.getElementById("previewWrap").classList.remove("show");
        document.getElementById("imagePreview").src = "";
        document.getElementById("fileInfo").textContent = "";

        setTimeout(loadDashboard, 1800);
      } catch (error) {
        console.error(error);
        showMessage("ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT";
      }
    }

    async function loadDashboard() {
      const name = employeeName.value.trim();
      const params = new URLSearchParams({
        action: "dashboard",
        name,
        t: Date.now().toString()
      });

      try {
        const response = await fetch(`${API_URL}?${params.toString()}`);
        const data = await response.json();

        renderMySteps(data.mySteps || 0, name);
        renderLeaderboard(data.top10 || []);
        renderTeams(data.teams || []);
      } catch (error) {
        console.error(error);
        document.getElementById("leaderboardList").innerHTML = "โหลดข้อมูลไม่สำเร็จ";
        document.getElementById("teamList").innerHTML = "โหลดข้อมูลไม่สำเร็จ";
      }
    }

    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = () => {
          URL.revokeObjectURL(objectUrl);

          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");

          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));

          const ctx = canvas.getContext("2d");

          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(
            blob => {
              if (!blob) {
                reject(new Error("Image compression failed"));
                return;
              }

              resolve(blob);
            },
            "image/jpeg",
            quality
          );
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Cannot read image"));
        };

        img.src = objectUrl;
      });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          resolve(String(reader.result).split(",")[1]);
        };

        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function createCompressedFileName(originalName) {
      const baseName = originalName.replace(/\.[^/.]+$/, "");
      return `${baseName}-compressed.jpg`;
    }

    function renderMySteps(value, name) {
      document.getElementById("mySteps").textContent =
        Number(value).toLocaleString();

      document.getElementById("myStepsLabel").textContent =
        name
          ? `ยอดสะสมของ ${name}`
          : "กรอกชื่อเพื่อดูยอดสะสมของคุณ";
    }

    function renderLeaderboard(items) {
      const el = document.getElementById("leaderboardList");

      if (!items.length) {
        el.innerHTML = `<div class="loading">ยังไม่มีข้อมูล</div>`;
        return;
      }

      el.innerHTML = items.map((item, index) => `
        <div class="leaderboard-row">
          <div class="rank">${medal(index)}</div>
          <div>
            <div class="name">${escapeHtml(item.name)}</div>
            <div class="dept">${escapeHtml(item.department || "")}</div>
          </div>
          <div class="steps">${Number(item.steps).toLocaleString()}</div>
        </div>
      `).join("");
    }

    function renderTeams(items) {
      const el = document.getElementById("teamList");

      if (!items.length) {
        el.innerHTML = `<div class="loading">ยังไม่มีข้อมูล</div>`;
        return;
      }

      el.innerHTML = items.map((item, index) => `
        <div class="team-row">
          <div class="rank">${index + 1}</div>
          <div class="name">${escapeHtml(item.team)}</div>
          <div class="steps">${Number(item.steps).toLocaleString()}</div>
        </div>
      `).join("");
    }

    function medal(index) {
      return ["🥇", "🥈", "🥉"][index] || (index + 1);
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) {
        return `${bytes} B`;
      }

      if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(0)} KB`;
      }

      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = `message show ${type}`;
    }

    function clearMessage() {
      formMessage.textContent = "";
      formMessage.className = "message";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    initOptions();
    loadDashboard();
  </script>
</body>
</html>
